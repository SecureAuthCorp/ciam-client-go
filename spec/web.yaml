definitions:
  DiscoveryIDP:
    properties:
      hidden:
        description: Whether IDP is hidden from the login page
        type: boolean
        x-nullable: false
      id:
        description: IDP ID
        type: string
        x-nullable: false
      instant_redirect:
        description: Whether to instantly redirect to this IDP
        type: boolean
        x-nullable: false
      logo_uri:
        description: IDP logo URI
        type: string
        x-nullable: false
      method:
        description: IDP method (e.g. oidc, saml, static)
        type: string
        x-nullable: false
      name:
        description: IDP display name
        type: string
        x-nullable: false
    type: object
  DiscoveryRequest:
    description: Discovery request
    properties:
      identifier:
        description: User identifier (e.g. email address)
        type: string
        x-nullable: false
      login_id:
        description: Login session ID (required for script_execution discovery mode)
        type: string
        x-nullable: false
      login_state:
        description: Login state (required for script_execution discovery mode)
        type: string
        x-nullable: false
    type: object
  DiscoveryResponse:
    properties:
      idps:
        description: List of matching IDPs
        items:
          $ref: '#/definitions/DiscoveryIDP'
        type: array
        x-nullable: false
    type: object
  Error:
    description: HTTP error response
    properties:
      details:
        type: object
        x-nullable: false
      error:
        type: string
        x-nullable: false
      error_code:
        type: string
        x-nullable: false
      status_code:
        format: int64
        type: integer
        x-nullable: false
    type: object
  Styling:
    properties:
      colors:
        properties:
          background:
            type: string
            x-nullable: false
          header:
            type: string
            x-nullable: false
          primary:
            type: string
            x-nullable: false
        type: object
        x-nullable: false
      font_url:
        type: string
        x-nullable: false
      logo_size:
        type: string
        x-nullable: false
      logo_url:
        type: string
        x-nullable: false
    type: object
info:
  title: ""
  version: ""
paths:
  /{aid}/login/discovery:
    post:
      description: |-
        Returns a list of IDPs that match the given user identifier based on
        identity pool membership, domain matching, or IDP discovery scripts.
      operationId: discoverIDPs
      parameters:
      - description: Authorization server id
        in: path
        name: aid
        required: true
        type: string
      - in: body
        name: Body
        schema:
          $ref: '#/definitions/DiscoveryRequest'
      responses:
        "200":
          $ref: '#/responses/DiscoveryResponse'
        "400":
          $ref: '#/responses/badRequestHTTPError'
        "404":
          $ref: '#/responses/notFoundHTTPError'
      summary: Discover IDPs for a user identifier.
      tags:
      - web
  /{aid}/styling:
    get:
      operationId: getStyling
      parameters:
      - default: admin
        description: Authorization server id
        in: path
        name: aid
        required: true
        type: string
      responses:
        "200":
          $ref: '#/responses/Styling'
        "404":
          $ref: '#/responses/notFoundHTTPError'
      summary: Get styling for a tenant.
      tags:
      - web
responses:
  DiscoveryResponse:
    description: Discovery response
    schema:
      $ref: '#/definitions/DiscoveryResponse'
  Styling:
    description: Styling
    schema:
      $ref: '#/definitions/Styling'
  badRequestHTTPError:
    description: Bad request
    schema:
      $ref: '#/definitions/Error'
  conflictHTTPError:
    description: Conflict
    schema:
      $ref: '#/definitions/Error'
  forbiddenHTTPError:
    description: Forbidden
    schema:
      $ref: '#/definitions/Error'
  internalServerErrorHTTPError:
    description: Internal server error
    schema:
      $ref: '#/definitions/Error'
  methodNotAllowedHTTPError:
    description: Method not allowed
    schema:
      $ref: '#/definitions/Error'
  notFoundHTTPError:
    description: Not found
    schema:
      $ref: '#/definitions/Error'
  payloadTooLargeHTTPError:
    description: Payload too large
    schema:
      $ref: '#/definitions/Error'
  preconditionFailedHTTPError:
    description: Precondition failed
    schema:
      $ref: '#/definitions/Error'
  tooManyRequestsHTTPError:
    description: Too many requests
    schema:
      $ref: '#/definitions/Error'
  unauthorizedHTTPError:
    description: Unauthorized
    schema:
      $ref: '#/definitions/Error'
  unprocessableEntityHTTPError:
    description: Unprocessable entity
    schema:
      $ref: '#/definitions/Error'
swagger: "2.0"
